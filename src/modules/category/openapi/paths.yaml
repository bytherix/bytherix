paths:
  /categories:
    get:
      tags:
        - Categories
      summary: Fetch all categories with pagination
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Categories fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchAllCategoriesResponse"
        "404":
          description: Categories not available.

    post:
      tags:
        - Categories
      summary: Create a category
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Required fields missing.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden. Missing category.create permission.

  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Fetch category by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
      responses:
        "200":
          description: Category fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Invalid ID format.
        "404":
          description: Category not found.

    patch:
      tags:
        - Categories
      summary: Update category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          description: Invalid ID format or bad request.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden. Missing category.update permission.
        "404":
          description: Category not found.

    delete:
      tags:
        - Categories
      summary: Delete category
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
      responses:
        "200":
          description: Category deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCategoryResponse"
        "400":
          description: Invalid ID format.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden. Missing category.delete permission.
        "404":
          description: Category not found.

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: string
          example: "66a1f3e9c4b7d9a123456789"
        name:
          type: string
          example: "Development"
        desc:
          type: string
          example: "Software engineering and development courses"

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Development"
        desc:
          type: string
          example: "Software engineering and development courses"

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: "Software Development"
        desc:
          type: string
          example: "Updated description"

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 50
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false
        nextPage:
          type: integer
          nullable: true
          example: 2
        previousPage:
          type: integer
          nullable: true
          example: null

    FetchAllCategoriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Categories fetched successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Category operation successful"
        data:
          $ref: "#/components/schemas/Category"

    DeleteCategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Category deleted successfully"
        data:
          type: object
          properties:
            _id:
              type: string
              example: "66a1f3e9c4b7d9a123456789"
            name:
              type: string
              example: "Development"
