paths:
  /payments/initiate:
    post:
      tags:
        - Payment
      summary: Initiate a payment for course enrollment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '201':
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '400':
          description: Invalid request data or validation failed
        '401':
          description: Unauthorized
        '404':
          description: Course not found or not accessible

  /payments/verify:
    post:
      tags:
        - Payment
      summary: Verify eSewa payment callback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
      responses:
        '200':
          description: Payment verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPaymentResponse'
        '400':
          description: Invalid payment data or verification failed
        '404':
          description: Payment not found

  /payments/{paymentId}:
    get:
      tags:
        - Payment
      summary: Get payment by ID
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            example: "66a1f3e9c4b7d9a123456789"
      responses:
        '200':
          description: Payment fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid payment ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden. Missing payment.read permission
        '404':
          description: Payment not found

  /payments/me:
    get:
      tags:
        - Payment
      summary: Get user's payments
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Payments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyPaymentsResponse'
        '401':
          description: Unauthorized

  /payments/course/{courseId}:
    get:
      tags:
        - Payment
      summary: Get payments for a specific course
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "66a1f3e9c4b7d9a123456789"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Course payments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCoursePaymentsResponse'
        '400':
          description: Invalid course ID
        '401':
          description: Unauthorized
        '403':
          description: Forbidden. Missing payment.read permission
        '404':
          description: Course not found