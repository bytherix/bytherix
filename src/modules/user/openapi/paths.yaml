paths:
  /users/all:
    get:
      tags:
        - Users
      summary: Fetch all verified users (Admin and Moderator access)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Users fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchAllUsersResponse"
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing users.read permission.

  /users/filtered:
    get:
      tags:
        - Users
      summary: Fetch all users prioritized by Admin and Moderator roles
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Users fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchAllUsersResponse"
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing users.read permission.

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user details by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
          description: User ID
      responses:
        "200":
          description: User fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid ID format.
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing users.read permission.
        "404":
          description: User not found.

  /users/{id}/role:
    patch:
      tags:
        - Users
      summary: Update a user's role (Admin access only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleRequest"
      responses:
        "200":
          description: User role updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid ID format or validation error.
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing users.update permission.
        "404":
          description: User not found.
