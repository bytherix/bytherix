paths:
  /contacts:
    post:
      tags:
        - Contact
      summary: Submit a new contact request
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Request sent successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContactResponse"
        "400":
          description: Please fill in all mandatory fields or validation error.

    get:
      tags:
        - Contact
      summary: Fetch all contact requests
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        "200":
          description: Requests fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchAllContactsResponse"
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing contact.read permission.

  /contacts/{id}:
    get:
      tags:
        - Contact
      summary: Fetch contact request by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
          description: Contact request ID
      responses:
        "200":
          description: Fetched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Invalid ID format.
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing contact.read permission.
        "404":
          description: Contact request not found.

    delete:
      tags:
        - Contact
      summary: Delete contact request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
          description: Contact request ID
      responses:
        "200":
          description: Contact removed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Invalid ID format.
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing contact.delete permission.
        "404":
          description: Contact request not found.

  /contacts/{id}/status:
    patch:
      tags:
        - Contact
      summary: Update contact request status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "66a1f3e9c4b7d9a123456789"
          description: Contact request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactStatusRequest"
      responses:
        "200":
          description: Contact updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Invalid ID format or status value.
        "401":
          description: Unauthorized access.
        "403":
          description: Forbidden. Missing contact.update permission.
        "404":
          description: Contact request not found.
