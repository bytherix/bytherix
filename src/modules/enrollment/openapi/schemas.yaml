components:
  schemas:
    Enrollment:
      type: object
      properties:
        id:
          type: string
          example: "66a1f3e9c4b7d9a123456789"
        user:
          type: string
          example: "66a1f3e9c4b7d9a123456780"
        course:
          type: object
          properties:
            id:
              type: string
              example: "66a1f3e9c4b7d9a123456789"
            title:
              type: string
              example: "Introduction to TypeScript"
            desc:
              type: string
              example: "Learn the fundamentals of TypeScript."
            thumbnail:
              type: object
              properties:
                imageUrl:
                  type: string
                  example: "https://example.com/image.png"
                publicId:
                  type: string
                  example: "image_id"
            level:
              type: string
              example: "beginner"
        status:
          type: string
          enum: [active, completed, cancelled]
          example: "active"
        progress:
          type: number
          example: 25
        completedVideoIds:
          type: array
          items:
            type: string
          example: ["66a1f3e9c4b7d9a123456781"]
        enrolledAt:
          type: string
          format: date-time
          example: "2026-08-07T14:15:00.000Z"
        lastAccessedAt:
          type: string
          format: date-time
          example: "2026-08-07T14:18:00.000Z"
        completedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: "2026-08-07T14:15:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-07T14:18:00.000Z"

    CreateEnrollmentRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: string
          example: "66a1f3e9c4b7d9a123456789"

    UpdateProgressRequest:
      type: object
      required:
        - videoId
      properties:
        videoId:
          type: string
          example: "66a1f3e9c4b7d9a123456781"

    EnrollmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Successfully enrolled in the course"
        data:
          $ref: "#/components/schemas/Enrollment"
