components:
  schemas:
    Enrollment:
      type: object
      properties:
        id:
          type: string
          example: "66a1f3e9c4b7d9a123456789"
        user:
          type: string
          example: "66a1f3e9c4b7d9a123456788"
        course:
          type: string
          example: "66a1f3e9c4b7d9a123456787"
        status:
          type: string
          enum: [active, completed, cancelled]
          example: active
        progress:
          type: number
          example: 45
        completedVideoIds:
          type: array
          items:
            type: string
          example: ["66a1f3e9c4b7d9a123456781", "66a1f3e9c4b7d9a123456782"]
        enrolledAt:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00.000Z"
        lastAccessedAt:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00.000Z"
        completedAt:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00.000Z"
        createdAt:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-07-23T10:30:00.000Z"

    CreateEnrollmentRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: string
          description: "Course ID to enroll in"
          example: "66a1f3e9c4b7d9a123456787"

    UpdateProgressRequest:
      type: object
      required:
        - videoId
      properties:
        videoId:
          type: string
          description: "Video ID to mark as completed"
          example: "66a1f3e9c4b7d9a123456781"

    EnrollmentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Successfully enrolled in the course"
        data:
          $ref: "#/components/schemas/Enrollment"

    GetMyEnrollmentsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Enrollments fetched successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"