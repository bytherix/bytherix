paths:
  /enrollments:
    post:
      tags:
        - Enrollments
      summary: Enroll in a course
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Successfully enrolled in the course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Course ID is required or validation failed
        '401':
          description: Unauthorized
        '409':
          description: Already enrolled in this course
  /enrollments/me:
    get:
      tags:
        - Enrollments
      summary: Get user's enrollments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Enrollments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMyEnrollmentsResponse'
        '401':
          description: Unauthorized
  /enrollments/{courseId}:
    get:
      tags:
        - Enrollments
      summary: Get enrollment by course ID
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          example: 66a1f3e9c4b7d9a123456789
      responses:
        '200':
          description: Enrollment details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Course ID is required or invalid
        '401':
          description: Unauthorized
        '404':
          description: Enrollment not found for this course
    patch:
      tags:
        - Enrollments
      summary: Update course progress
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          example: 66a1f3e9c4b7d9a123456789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgressRequest'
      responses:
        '200':
          description: Progress updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Course ID or Video ID is required or invalid
        '401':
          description: Unauthorized
        '404':
          description: Enrollment not found or video does not belong to this course
    delete:
      tags:
        - Enrollments
      summary: Cancel enrollment
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
          example: 66a1f3e9c4b7d9a123456789
      responses:
        '200':
          description: Enrollment cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400':
          description: Course ID is required or invalid
        '401':
          description: Unauthorized
        '404':
          description: Enrollment not found