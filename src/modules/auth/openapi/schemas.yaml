components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - phone
      properties:
        fullName:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          example: "password123"
        phone:
          type: string
          example: "+1234567890"

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Registered successfully"
        data:
          type: object
          properties:
            id:
              type: string
              example: "66a1f2e9c4b7d9a123456789"
            fullName:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "john.doe@example.com"
            isVerified:
              type: boolean
              example: false
            message:
              type: string
              example: "Registration successful. Please verify your email."

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login successful"
        data:
          type: object
          properties:
            success:
              type: boolean
              example: true
            message:
              type: string
              example: "Login successful"
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "66a1f2e9c4b7d9a123456789"
                    fullName:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      example: "john.doe@example.com"
                    isVerified:
                      type: boolean
                      example: true
                    role:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "66a1f3e9c4b7d9a123456789"
                        name:
                          type: string
                          example: "student"
                        permissions:
                          type: array
                          items:
                            type: string
                          example: ["course.read"]

    VerifyEmailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Email verified successfully"

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Logged out successfully."

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"

    ForgotPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Password reset link sent to your email."

    ResetPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          example: "newpassword123"

    ResetPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Password reset successful."

    GoogleLoginRequest:
      type: object
      required:
        - credential
      properties:
        credential:
          type: string
          description: "Google ID Token/Credential from Frontend"
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjFlOTg..."

    GoogleLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Google login successful"
        data:
          type: object
          properties:
            success:
              type: boolean
              example: true
            message:
              type: string
              example: "Google login successful"
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "66a1f2e9c4b7d9a123456789"
                    fullName:
                      type: string
                      example: "John Doe"
                    email:
                      type: string
                      example: "john.doe@example.com"
                    isVerified:
                      type: boolean
                      example: true
                    role:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "66a1f3e9c4b7d9a123456789"
                        name:
                          type: string
                          example: "student"

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Token refreshed successfully"
        data:
          type: object
          properties:
            success:
              type: boolean
              example: true
            message:
              type: string
              example: "Token refreshed successfully"
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "66a1f2e9c4b7d9a123456789"
                    email:
                      type: string
                      example: "john.doe@example.com"
                    role:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "66a1f3e9c4b7d9a123456789"
                        name:
                          type: string
                          example: "student"


