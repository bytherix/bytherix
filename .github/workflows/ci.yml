name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
          

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
       

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Test
        run: yarn test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/bytherix_test

          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-secret-min-32-characters-long

          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars

          COOKIE_SECRET: test-cookie-secret-min-32-chars!!



      - name: Build
        run: yarn build

      - name: Security audit
        run: yarn audit --level moderate